<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Scout | Live eBay listings</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4ee;color:#191b19;font:16px system-ui,sans-serif}main,header>div{max-width:1050px;margin:auto;padding:28px}header{background:#191b19;color:white;border-bottom:6px solid #bdfa45}h1{font-size:clamp(2.8rem,8vw,5rem);letter-spacing:-.07em;margin:.15em 0}header a{color:#bdfa45}.panel,li{background:white;border:1px solid #d6d8ce;border-radius:14px;padding:18px}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}label{display:grid;gap:5px;font-weight:650}input,select,button{font:inherit;padding:10px;border:1px solid #a5a99c;border-radius:8px;min-width:0}button{background:#bdfa45;font-weight:750;align-self:end;cursor:pointer}ul{list-style:none;padding:0;display:grid;gap:9px}li a{color:#19460d;font-weight:750}li p{margin:.4em 0 0}.note{color:#53584f}
</style>
<header><div><a href="./">Card Scout watchlist</a><h1>Live listings</h1><p>Search eBay US and Canada for Topps singles, sealed packs and boxes.</p></div></header>
<main><div class="panel"><form id="search">
<label>Topps search<input name="q" value="Topps Juventus" maxlength="160" required></label>
<label>Delivery market<select name="market"><option value="US">United States</option><option value="CA">Canada</option></select></label>
<label>ZIP or postal code<input name="postal" maxlength="10" placeholder="Optional"></label>
<label>Buying format<select name="mode"><option value="fixed">Buy It Now</option><option value="auction">Auctions</option></select></label>
<button>Search eBay</button></form></div>
<p class="note">Include the set, season and card number or box format to narrow the search. Shipping estimates may change at checkout. Taxes and import charges are excluded.</p>
<p id="status" role="status"></p><ul id="list"></ul>
</main>
<script type="module">
const form = document.querySelector('#search');
const status = document.querySelector('#status');
const list = document.querySelector('#list');
let controller;
const config = fetch('./live-config.json', { cache: 'no-store' })
  .then(response => response.ok ? response.json() : null).catch(() => null);
if (!(await config)?.endpoint) status.textContent = 'Live search is awaiting backend deployment.';
form.addEventListener('submit', async event => {
  event.preventDefault();
  controller?.abort();
  const request = new AbortController();
  controller = request;
  const query = new URLSearchParams(new FormData(form));
  if (!/\btopps\b/i.test(query.get('q'))) query.set('q', 'Topps ' + query.get('q'));
  const market = query.get('market');
  const auction = query.get('mode') === 'auction';
  list.replaceChildren();
  status.textContent = 'Checking eBay…';
  try {
    const endpoint = (await config)?.endpoint;
    if (!endpoint) throw new Error('Live search is awaiting backend deployment.');
    const url = new URL(endpoint);
    url.search = query;
    const response = await fetch(url, { signal: request.signal, cache: 'no-store' });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error ?? 'Live search failed.');
    if (request.signal.aborted) return;
    const preferred = market === 'CA' ? 'CAD' : 'USD';
    const ranked = item => !auction && item.currency === preferred && item.shipping !== null;
    data.items.sort((a,b) => Number(ranked(b)) - Number(ranked(a)) ||
      (ranked(a) && ranked(b) ? a.price + a.shipping - b.price - b.shipping : 0));
    status.textContent = data.items.length ? data.items.length + ' results checked at ' + new Date(data.checked).toLocaleTimeString() : 'No matching listings found.';
    for (const item of data.items) {
      const money = value => new Intl.NumberFormat('en', { style:'currency', currency:item.currency, currencyDisplay:'code' }).format(value);
      const row = document.createElement('li');
      const link = document.createElement('a');
      link.href = item.url;
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = item.title;
      const details = document.createElement('p');
      details.textContent = [item.seller ? 'Seller ' + item.seller : '', (auction ? 'Bid or starting price ' : '') + money(item.price),
        item.shipping === null ? 'Shipping unknown' : money(item.shipping) + ' shipping',
        ranked(item) ? money(item.price + item.shipping) + ' delivered before tax' : ''].filter(Boolean).join(' · ');
      row.append(link,details);
      list.append(row);
    }
  } catch(error) {
    if (!request.signal.aborted) status.textContent = error.message;
  }
});
</script>
</html>
